name: PR
on:
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
jobs:
  pr:
    name: pr
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: yarn

      - name: build
        run: yarn build

      - name: lint
        run: yarn lint

      - name: test
        run: yarn test --forceExit
